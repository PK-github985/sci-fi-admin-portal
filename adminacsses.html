<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .video-background iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="video-background">
        <iframe id="vimeo-video" src="https://player.vimeo.com/video/1004016074?autoplay=1&loop=1&title=0&byline=0&portrait=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
       document.addEventListener("DOMContentLoaded", async function () {
    var iframe = document.getElementById('vimeo-video');
    var player = new Vimeo.Player(iframe);

    // Function to request fullscreen for the entire document
    async function enterFullScreen() {
        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                await document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                await document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                await document.documentElement.msRequestFullscreen();
            }
        }
    }

    // Ensure fullscreen mode stays active
    function ensureFullScreen() {
        document.addEventListener("fullscreenchange", async () => {
            if (!document.fullscreenElement) {
                await enterFullScreen();
            }
        });
    }

    // Request fullscreen when video starts playing
    player.on('play', async function () {
        console.log('Video is playing');
        await enterFullScreen();
    });

    // Pause video when it ends (if looping is disabled)
    player.on('ended', function () {
        player.pause().then(function () {
            console.log('Video paused after one loop.');
        }).catch(function (error) {
            console.error('Error pausing the video:', error);
        });
    });

    // Ensure fullscreen remains active
    ensureFullScreen();
    await enterFullScreen();
});

    </script>
</body>
</html>
